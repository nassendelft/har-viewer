name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-macos-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-macos-

      - name: Build
        run: ./gradlew :app:linkReleaseExecutableMacosArm64

      - name: Rename binary
        run: mv app/build/bin/macosArm64/releaseExecutable/app.kexe app/build/bin/macosArm64/releaseExecutable/har-view

      - uses: actions/upload-artifact@v4
        with:
          name: har-viewer-macos-arm64
          path: app/build/bin/macosArm64/releaseExecutable/har-view

  build-macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-macos-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-macos-

      - name: Build
        run: ./gradlew :app:linkReleaseExecutableMacosX64

      - name: Rename binary
        run: mv app/build/bin/macosX64/releaseExecutable/app.kexe app/build/bin/macosX64/releaseExecutable/har-view

      - uses: actions/upload-artifact@v4
        with:
          name: har-viewer-macos-x64
          path: app/build/bin/macosX64/releaseExecutable/har-view

  build-linux-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libstdc++-11-dev-arm64-cross

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-linux-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-linux-

      - name: Build
        run: ./gradlew :app:linkReleaseExecutableLinuxArm64 -Pnative.target=linuxArm64

      - name: Rename binary
        run: mv app/build/bin/linuxArm64/releaseExecutable/app.kexe app/build/bin/linuxArm64/releaseExecutable/har-view

      - uses: actions/upload-artifact@v4
        with:
          name: har-viewer-linux-arm64
          path: app/build/bin/linuxArm64/releaseExecutable/har-view

  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libstdc++-11-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-linux-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-linux-

      - name: Build
        run: ./gradlew :app:linkReleaseExecutableLinuxX64

      - name: Rename binary
        run: mv app/build/bin/linuxX64/releaseExecutable/app.kexe app/build/bin/linuxX64/releaseExecutable/har-view

      - uses: actions/upload-artifact@v4
        with:
          name: har-viewer-linux-x64
          path: app/build/bin/linuxX64/releaseExecutable/har-view